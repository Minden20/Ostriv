name: Release - Build Native Installers

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --yes

      # ВИПРАВЛЕНО: Використовуємо універсальний bash-виклик з чітким розділенням аргументів
      - name: Build Executable Fat JAR
        shell: bash
        run: mvn clean package -DskipTests=true -Dcheckstyle.skip=true -Dspotless.check.skip=true -B

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp target/ostriv-1.0-SNAPSHOT.jar jpackage-input/

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "LINUX_VERSION=${RAW_VERSION}-1" >> $GITHUB_OUTPUT

      - name: Package Installer (Windows MSI)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          jpackage --type msi --name "Ostriv" --app-version "${{ steps.version.outputs.VERSION }}" --vendor "Minden" --input jpackage-input/ --main-jar ostriv-1.0-SNAPSHOT.jar --icon packaging/icon.ico --dest dist/ --win-dir-chooser --win-menu --win-shortcut

      - name: Package Installer (Linux DEB)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type deb --name "ostriv" --app-version "${{ steps.version.outputs.LINUX_VERSION }}" --vendor "Minden" --input jpackage-input/ --main-jar ostriv-1.0-SNAPSHOT.jar --dest dist/ --linux-shortcut

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
          retention-days: 1

  publish-release:
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ostriv Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Release Changes for ${{ github.ref_name }}
            Official production deployment files for Ostriv.
            
            ## Download Installers:
            | Operating System | Installer File |
            |---|---|
            | Windows 10 / 11 | `*.msi` |
            | Ubuntu / Debian | `*.deb` |
          files: |
            installers/*.msi
            installers/*.deb
          draft: false
          prerelease: false